services:
  diting-nonebot:
    image: diting-nonebot${SUFFIX:-}:latest
    networks:
      - ditingbot${SUFFIX:-}
    container_name: diting-nonebot${SUFFIX:-}
    depends_on:
    #   - mysql
      - diting-redis
    build: .
    env_file:
      - .env
    ports:
      - "${BOT_HOST_PORT:-6090}:6090"
    volumes:
      - "./logs:/app/logs"
      - "./data:/app/data"
      - "./src/plugins/auto_manage_group/sell_ad_group_model:/app/src/plugins/auto_manage_group/sell_ad_group_model"
      # 常驻源码挂载 — 使容器始终读取宿主机代码，HOT_RELOAD 控制是否自动重启
      - "./src:/app/src"
      - "./bot.py:/app/bot.py"
      # 环境文件挂载 — git pull 更新 .env.* 后可由 watcher 检测并触发重载
      - "./.env:/app/.env:ro"
      - "./.env.${ENVIRONMENT:-prod}:/app/.env.${ENVIRONMENT:-prod}:ro"
    environment:
      - TZ=Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"

  diting-redis:
    networks:
      - ditingbot${SUFFIX:-}
    container_name: diting-redis${SUFFIX:-}
    image: library/redis:latest
    command: redis-server --requirepass 12345678
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    environment:
      - TZ=Asia/Shanghai

