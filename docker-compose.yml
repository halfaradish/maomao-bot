services:
  diting-nonebot:
    networks:
      - ditingbot
    container_name: diting-nonebot
    depends_on:
    #   - mysql
      - diting-redis
    build: .
    env_file:
      - .env
    ports:
      - "6090:6090"
    volumes:
      - "./logs:/app/logs"
      - "./data:/app/data"
    environment:
      - TZ=Asia/Shanghai  # 统一时区
    extra_hosts:
      - "host.docker.internal:host-gateway"  # 允许容器通过此主机名访问宿主机服务

  diting-redis:
    networks:
      - ditingbot
    container_name: diting-redis
    image: library/redis:latest
    command: redis-server --requirepass 12345678 #Redis 密码
    ports:
      - "6379:6379"
    environment:
      - TZ=Asia/Shanghai  # 统一时区

