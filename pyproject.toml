[project]
name = "DiTing-NoneBot"
version = "0.1.0"
description = "DiTing-NoneBot"
readme = "README.md"
requires-python = ">=3.10, <3.13"

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = [
    "nonebot_plugin_apscheduler",
    "nonebot_plugin_prometheus",
    "nonebot_plugin_alconna"
]
plugin_dirs = ["src/plugins"]
builtin_plugins = ["echo"]

[tool.nonebot.config]
delay_enabled = true

[tool.poetry]
name = "diting-nonebot"
version = "0.1.0"
description = "DiTing-NoneBot"
readme = "README.md"
packages = [{ include = "src", from = "." }]
[tool.poetry.dependencies]
aiohttp = "3.12.15"
html2image = "2.0.7"
pillow = "11.3.0"
playwright = "1.55.0"
pydantic = "2.11.9"
python-dotenv = "1.1.1"
redis = "6.4.0"
requests = "2.32.5"
ddddocr = "1.5.6"
python-multipart = "^0.0.20"
pipx = "^1.8.0"
mysql-connector-python = "9.3.0"
nonebot-adapter-onebot = "^2.4.6"
nonebot-plugin-apscheduler = "^0.5.0"
nonebot-adapter-console = "^0.9.0"
nonebot-plugin-prometheus = "^0.4.1"
nonebot2 = {extras = ["fastapi"], version = "^2.4.4"}
pytz = "^2025.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncmy = "^0.2.9"
tzdata = "^2025.1"
torch = "^2.10.0"
transformers = "^5.3.0"
aiofiles = "^25.1.0"
openai = "^2.30.0"
langgraph = "^1.1.6"
langchain-core = "^1.2.26"
langchain-community = "^0.4.1"
tiktoken = "^0.12.0"
cryptography = "^46.0.6"
jinja2 = "^3.1.6"
loguru = "^0.7.3"
