<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>谛听 · 权限管理</title>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta property="og:title" content="谛听 · 权限管理">
  <meta property="og:description" content="DiTing NoneBot 权限系统管理面板">
  <meta property="og:type" content="website">
  <script>
    // 渲染前应用主题,避免刷新闪烁 (与 src/hooks/useTheme.ts 的 readInitial 逻辑一致)
    (function () {
      try {
        var t = localStorage.getItem("diting_theme");
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.classList.toggle("dark", t === "dark");
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
