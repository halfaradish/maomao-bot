<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>谛听 · 权限管理</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
/* ===== Dark theme ===== */
:root {
    --pico-font-size: 93.75%;
    --pico-background-color: #13171f;
    --pico-color: #c9d1d9;
    --pico-text-selection-color: rgba(88, 166, 255, 0.3);
    --pico-muted-color: #8b949e;
    --pico-muted-border-color: #30363d;
    --pico-primary: #58a6ff;
    --pico-primary-background: #1f6feb;
    --pico-primary-border: var(--pico-primary-background);
    --pico-primary-hover: #388bfd;
    --pico-primary-hover-background: #1158c7;
    --pico-primary-focus: rgba(88, 166, 255, 0.25);
    --pico-primary-inverse: #fff;
    --pico-secondary: #8b949e;
    --pico-secondary-background: #21262d;
    --pico-secondary-border: #30363d;
    --pico-secondary-hover: #c9d1d9;
    --pico-secondary-hover-background: #30363d;
    --pico-contrast: #f0f6fc;
    --pico-contrast-background: #1c2128;
    --pico-contrast-border: #8b949e;
    --pico-contrast-hover: #fff;
    --pico-danger-background: #da3633;
    --pico-danger-border: #f85149;
    --pico-danger-hover-background: #b62324;
    --pico-form-element-background-color: #0d1117;
    --pico-form-element-border-color: #30363d;
    --pico-form-element-color: #c9d1d9;
    --pico-form-element-placeholder-color: #6e7681;
}

body { min-height: 100vh; display: flex; flex-direction: column; }

/* ===== Layout ===== */
.app-header {
    position: sticky; top: 0; z-index: 100;
    background: var(--pico-background-color);
    border-bottom: 1px solid var(--pico-muted-border-color);
    padding: 0.5rem 0;
}
.app-header .container {
    display: flex; align-items: center; justify-content: space-between;
}
.app-brand {
    font-weight: 700; font-size: 1.1rem; color: var(--pico-primary);
    text-decoration: none;
}
.app-nav { display: flex; gap: 0.5rem; align-items: center; }
.app-nav a { color: var(--pico-muted-color); text-decoration: none; font-size: 0.9rem; }
.app-nav a:hover, .app-nav a.router-link-active { color: var(--pico-primary); }
.app-nav .user-tag { font-size: 0.8rem; color: var(--pico-muted-color); margin-right: 0.5rem; }

.app-main { flex: 1; padding: 1.5rem 0; }
.container { max-width: 960px; }

/* ===== Confirm overlay ===== */
.confirm-overlay {
    position: fixed; inset: 0; z-index: 999;
    background: rgba(0,0,0,0.55);
    display: flex; align-items: center; justify-content: center;
}
.confirm-box {
    background: var(--pico-contrast-background);
    border: 1px solid var(--pico-muted-border-color);
    border-radius: 6px; padding: 1.5rem; max-width: 400px; width: 90%;
}
.confirm-box h3 { margin-bottom: 0.5rem; }
.confirm-box p { color: var(--pico-muted-color); margin-bottom: 1rem; }
.confirm-actions { display: flex; gap: 0.5rem; justify-content: flex-end; }

/* ===== Tables ===== */
.table-wrap { overflow-x: auto; }
table { white-space: nowrap; font-size: 0.9rem; }

/* ===== Misc ===== */
.page-title { margin-bottom: 1rem; }
.section-title { font-size: 0.85rem; color: var(--pico-muted-color); text-transform: uppercase; letter-spacing: 0.05em; margin: 1.5rem 0 0.5rem; }
.empty-state { text-align: center; padding: 2rem; color: var(--pico-muted-color); }
.inline-form { display: flex; gap: 0.5rem; align-items: flex-end; margin-bottom: 1rem; flex-wrap: wrap; }
.inline-form input, .inline-form select { margin-bottom: 0; width: auto; min-width: 140px; }
.toast { position: fixed; bottom: 1rem; right: 1rem; z-index: 1000; padding: 0.6rem 1rem; border-radius: 4px; font-size: 0.85rem; color: #fff; background: #238636; animation: fadeIn 0.2s; }
.toast.error { background: #da3633; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.pagination { display: flex; align-items: center; gap: 0.75rem; margin-top: 1rem; font-size: 0.85rem; }
.pagination span { color: var(--pico-muted-color); }

.breadcrumb { margin-bottom: 1rem; font-size: 0.85rem; }
.breadcrumb a { color: var(--pico-primary); }

.login-box { max-width: 380px; margin: 4rem auto; }
.login-hint { font-size: 0.8rem; color: var(--pico-muted-color); margin-top: 0.5rem; }

.dashboard-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
.dashboard-cards article { padding: 1.5rem; cursor: pointer; transition: border-color 0.2s; }
.dashboard-cards article:hover { border-color: var(--pico-primary); }
.dashboard-cards h4 { margin-bottom: 0.3rem; }
.dashboard-cards p { margin-bottom: 0; font-size: 0.85rem; color: var(--pico-muted-color); }
</style>
</head>
<body id="app">
    <!-- ===== Header ===== -->
    <header class="app-header" v-if="state.token && !isLoginPage">
        <div class="container">
            <router-link to="/" class="app-brand">谛听 · 权限管理</router-link>
            <nav class="app-nav">
                <router-link to="/groups">权限组</router-link>
                <router-link to="/bindings">群绑定</router-link>
                <span class="user-tag">QQ {{ state.user?.qq_number || '—' }}</span>
                <a href="#" @click.prevent="logout">退出</a>
            </nav>
        </div>
    </header>

    <!-- ===== Main ===== -->
    <main class="app-main">
        <div class="container">
            <router-view></router-view>
        </div>
    </main>

    <!-- ===== Confirm overlay ===== -->
    <div v-if="confirmState.show" class="confirm-overlay" @click.self="confirmState.reject">
        <div class="confirm-box">
            <h3>{{ confirmState.title }}</h3>
            <p>{{ confirmState.message }}</p>
            <div class="confirm-actions">
                <button class="secondary" @click="confirmState.reject">取消</button>
                <button class="contrast" @click="confirmState.resolve">确认删除</button>
            </div>
        </div>
    </div>

    <!-- ===== Toast ===== -->
    <div v-if="toast.show" :class="['toast', toast.type]">{{ toast.message }}</div>

    <!-- ===== Scripts ===== -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>

    <script type="module">
    const { createApp, ref, reactive, computed, watch, onMounted } = Vue;
    const { createRouter, createWebHashHistory } = VueRouter;

    // ---------------------------------------------------------------------------
    // Constants
    // ---------------------------------------------------------------------------
    const API_BASE = '/api/v1';
    const STORAGE_KEY = 'diting_jwt';
    const PAGE_SIZE = 10;

    // ---------------------------------------------------------------------------
    // Global state
    // ---------------------------------------------------------------------------
    const state = reactive({
        token: localStorage.getItem(STORAGE_KEY) || '',
        user: null,
        loading: false,
    });

    // ---------------------------------------------------------------------------
    // Confirm dialog (Promise-based)
    // ---------------------------------------------------------------------------
    const confirmState = reactive({
        show: false, title: '', message: '',
        resolve: null, reject: null,
    });

    function showConfirm(title, message) {
        return new Promise((resolve, reject) => {
            confirmState.show = true;
            confirmState.title = title;
            confirmState.message = message;
            confirmState.resolve = () => { confirmState.show = false; resolve(); };
            confirmState.reject = () => { confirmState.show = false; reject(); };
        });
    }

    // ---------------------------------------------------------------------------
    // Toast
    // ---------------------------------------------------------------------------
    const toast = reactive({ show: false, message: '', type: '', _timer: null });

    function showToast(message, type = '') {
        toast.message = message; toast.type = type; toast.show = true;
        clearTimeout(toast._timer);
        toast._timer = setTimeout(() => { toast.show = false; }, 3000);
    }

    // ---------------------------------------------------------------------------
    // Token helpers
    // ---------------------------------------------------------------------------
    function saveToken(token) {
        state.token = token;
        localStorage.setItem(STORAGE_KEY, token);
    }

    function clearToken() {
        state.token = '';
        state.user = null;
        localStorage.removeItem(STORAGE_KEY);
    }

    // ---------------------------------------------------------------------------
    // API wrapper
    // ---------------------------------------------------------------------------
    async function api(method, path, body = null) {
        const headers = {};
        if (body) headers['Content-Type'] = 'application/json';
        if (state.token) headers['Authorization'] = `Bearer ${state.token}`;

        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);

        const res = await fetch(`${API_BASE}${path}`, opts);

        if (res.status === 401) {
            clearToken();
            showToast('登录已过期，请重新登录', 'error');
            router.push('/login');
            throw new Error('登录已过期');
        }

        const json = await res.json();

        if (json.status === 'error') {
            throw new Error(json.message || '请求失败');
        }

        return json;
    }

    // Convenience methods
    const apiGet = (path) => api('GET', path);
    const apiPost = (path, body) => api('POST', path, body);
    const apiDelete = (path) => api('DELETE', path);

    // ---------------------------------------------------------------------------
    // Router
    // ---------------------------------------------------------------------------
    const router = createRouter({
        history: createWebHashHistory(),
        routes: [
            { path: '/login', component: {}, name: 'login' },
            { path: '/', component: {}, name: 'home' },
            { path: '/groups', component: {}, name: 'groups' },
            { path: '/groups/:id', component: {}, name: 'group-detail' },
            { path: '/bindings', component: {}, name: 'bindings' },
        ],
    });

    router.beforeEach((to) => {
        if (to.name !== 'login' && !state.token) {
            return { name: 'login' };
        }
    });

    // ---------------------------------------------------------------------------
    // Components
    // ---------------------------------------------------------------------------

    // -- Login ----------------------------------------------------------------
    const LoginPage = {
        template: `
        <div class="login-box">
            <h3>谛听 · 权限管理</h3>
            <p style="color:var(--pico-muted-color)">请使用 QQ 临时密码登录</p>
            <form @submit.prevent="doLogin">
                <label>QQ 号
                    <input type="text" v-model="qq" placeholder="输入 QQ 号" required autofocus>
                </label>
                <label>临时密码
                    <input type="text" v-model="pwd" placeholder="6 位数字" maxlength="6" required>
                </label>
                <button type="submit" :aria-busy="busy">登录</button>
            </form>
            <div class="login-hint">
                在 QQ 中发送 <code>权限 登录</code> 获取临时密码，5 分钟内有效。
            </div>
        </div>`,
        data: () => ({ qq: '', pwd: '', busy: false }),
        methods: {
            async doLogin() {
                this.busy = true;
                try {
                    const res = await api('POST', '/auth/login', {
                        qq_number: this.qq,
                        temp_password: this.pwd,
                    });
                    saveToken(res.data.token);
                    state.user = { qq_number: this.qq };
                    showToast('登录成功');
                    router.replace('/');
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    this.busy = false;
                }
            },
        },
    };

    // -- Dashboard ----------------------------------------------------------------
    const Dashboard = {
        template: `
        <div>
            <h3 class="page-title">权限管理系统</h3>
            <div class="dashboard-cards">
                <article @click="$router.push('/groups')">
                    <h4>权限组</h4>
                    <p>管理 RBAC 角色、成员和权限点分配</p>
                </article>
                <article @click="$router.push('/bindings')">
                    <h4>群绑定</h4>
                    <p>关联 QQ 群与权限组</p>
                </article>
            </div>
        </div>`,
    };

    // -- GroupList ----------------------------------------------------------------
    const GroupList = {
        template: `
        <div>
            <h3 class="page-title">权限组</h3>

            <!-- Create form -->
            <button v-if="!showCreate" class="secondary" @click="showCreate = true">+ 创建权限组</button>
            <form v-else @submit.prevent="doCreate" class="inline-form">
                <input type="text" v-model="form.name" placeholder="标识名 (英文)" required maxlength="100" style="width:150px">
                <input type="text" v-model="form.display_name" placeholder="显示名 (中文)" maxlength="200" style="width:160px">
                <input type="text" v-model="form.description" placeholder="描述" maxlength="200" style="width:200px">
                <button type="submit" :aria-busy="creating">创建</button>
                <button type="button" class="secondary" @click="showCreate = false; resetForm()">取消</button>
            </form>

            <div class="table-wrap">
                <table v-if="groups.length">
                    <thead><tr>
                        <th>ID</th><th>标识名</th><th>显示名</th><th>描述</th><th>创建时间</th><th>操作</th>
                    </tr></thead>
                    <tbody>
                        <tr v-for="g in groups" :key="g.id">
                            <td>{{ g.id }}</td>
                            <td><code>{{ g.name }}</code></td>
                            <td>{{ g.display_name || '—' }}</td>
                            <td>{{ g.description || '—' }}</td>
                            <td>{{ fmt(g.created_at) }}</td>
                            <td>
                                <a href="#" @click.prevent="$router.push('/groups/' + g.id)">详情</a>
                                <a href="#" @click.prevent="doDelete(g)" style="color:var(--pico-danger-background);margin-left:0.5rem">删除</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
                <div v-else class="empty-state">暂无权限组，点击上方按钮创建</div>
            </div>

            <div class="pagination" v-if="total > PAGE_SIZE">
                <button class="secondary" :disabled="page <= 1" @click="load(page - 1)">上一页</button>
                <span>第 {{ page }} 页，共 {{ total }} 条</span>
                <button class="secondary" :disabled="page * PAGE_SIZE >= total" @click="load(page + 1)">下一页</button>
            </div>
        </div>`,
        data: () => ({
            groups: [], total: 0, page: 1,
            showCreate: false, creating: false,
            form: { name: '', display_name: '', description: '' },
        }),
        methods: {
            async load(p = 1) {
                state.loading = true;
                try {
                    const res = await apiGet(`/permissions/groups?page=${p}&size=${PAGE_SIZE}`);
                    this.groups = res.data.items;
                    this.total = res.data.total;
                    this.page = res.data.page;
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    state.loading = false;
                }
            },
            async doCreate() {
                this.creating = true;
                try {
                    await apiPost('/permissions/groups', { ...this.form });
                    showToast('权限组已创建');
                    this.showCreate = false;
                    this.resetForm();
                    await this.load();
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    this.creating = false;
                }
            },
            async doDelete(g) {
                try {
                    await showConfirm('删除权限组', `确定删除 "${g.display_name || g.name}"？此操作不可逆，将级联删除其所有成员和权限点绑定。`);
                    await apiDelete(`/permissions/groups/${g.id}`);
                    showToast('已删除');
                    await this.load();
                } catch { /* user cancelled */ }
            },
            resetForm() {
                this.form = { name: '', display_name: '', description: '' };
            },
            fmt(ts) {
                if (!ts) return '—';
                try { return new Date(ts).toLocaleString('zh-CN'); } catch { return ts; }
            },
        },
        mounted() { this.load(); },
    };

    // -- GroupDetail ----------------------------------------------------------------
    const GroupDetail = {
        template: `
        <div>
            <div class="breadcrumb">
                <a href="#" @click.prevent="$router.push('/groups')">← 返回权限组列表</a>
            </div>

            <h3 class="page-title">{{ group.display_name || group.name }} <small style="color:var(--pico-muted-color)">#{{ group.id }}</small></h3>
            <p v-if="group.description" style="color:var(--pico-muted-color)">{{ group.description }}</p>

            <!-- Members -->
            <h4 class="section-title">成员 ({{ members.length }})</h4>
            <form @submit.prevent="addMember" class="inline-form">
                <input type="text" v-model="newMemberIds" placeholder="QQ 号，多个用逗号分隔" style="min-width:260px" required>
                <button type="submit" :aria-busy="addingMember">添加</button>
            </form>
            <div class="table-wrap">
                <table v-if="members.length">
                    <thead><tr><th>ID</th><th>QQ 号</th><th>加入时间</th><th>操作</th></tr></thead>
                    <tbody>
                        <tr v-for="m in members" :key="m.id">
                            <td>{{ m.id }}</td><td>{{ m.user_id }}</td><td>{{ fmt(m.created_at) }}</td>
                            <td><a href="#" @click.prevent="removeMember(m)" style="color:var(--pico-danger-background)">移除</a></td>
                        </tr>
                    </tbody>
                </table>
                <div v-else class="empty-state">暂无成员</div>
            </div>

            <!-- Permissions -->
            <h4 class="section-title">权限点 ({{ permissions.length }})</h4>
            <form @submit.prevent="addPerm" class="inline-form">
                <input type="text" v-model="newPermKeys" placeholder="权限 key，多个用逗号分隔，如 plugin:action" style="min-width:360px" required>
                <button type="submit" :aria-busy="addingPerm">添加</button>
            </form>
            <div class="table-wrap">
                <table v-if="permissions.length">
                    <thead><tr><th>ID</th><th>权限 Key</th><th>分配时间</th><th>操作</th></tr></thead>
                    <tbody>
                        <tr v-for="p in permissions" :key="p.id">
                            <td>{{ p.id }}</td><td><code>{{ p.perm_key }}</code></td><td>{{ fmt(p.created_at) }}</td>
                            <td><a href="#" @click.prevent="removePerm(p)" style="color:var(--pico-danger-background)">移除</a></td>
                        </tr>
                    </tbody>
                </table>
                <div v-else class="empty-state">暂无权限点</div>
            </div>
        </div>`,
        data: () => ({
            group: {},
            members: [],
            permissions: [],
            newMemberIds: '',
            newPermKeys: '',
            addingMember: false,
            addingPerm: false,
        }),
        methods: {
            async load() {
                state.loading = true;
                try {
                    const res = await apiGet(`/permissions/groups/${this.$route.params.id}`);
                    this.group = res.data;
                    this.members = res.data.members || [];
                    this.permissions = res.data.permissions || [];
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    state.loading = false;
                }
            },
            async addMember() {
                const ids = this.newMemberIds.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean).map(Number);
                if (!ids.length) return;
                this.addingMember = true;
                try {
                    const res = await apiPost(`/permissions/groups/${this.group.id}/members`, { user_ids: ids });
                    showToast(res.message || '已添加');
                    this.newMemberIds = '';
                    await this.load();
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    this.addingMember = false;
                }
            },
            async removeMember(m) {
                try {
                    await showConfirm('移除成员', `确定将 QQ ${m.user_id} 从权限组中移除？`);
                    const res = await apiDelete(`/permissions/groups/${this.group.id}/members/${m.user_id}`);
                    showToast(res.message || '已移除');
                    await this.load();
                } catch { /* user cancelled */ }
            },
            async addPerm() {
                const keys = this.newPermKeys.split(/[,，\s]+/).map(s => s.trim()).filter(Boolean);
                if (!keys.length) return;
                this.addingPerm = true;
                try {
                    const res = await apiPost(`/permissions/groups/${this.group.id}/perms`, { perm_keys: keys });
                    showToast(res.message || '已添加');
                    this.newPermKeys = '';
                    await this.load();
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    this.addingPerm = false;
                }
            },
            async removePerm(p) {
                try {
                    await showConfirm('移除权限点', `确定移除权限点 "${p.perm_key}"？`);
                    const res = await apiDelete(`/permissions/groups/${this.group.id}/perms/${encodeURIComponent(p.perm_key)}`);
                    showToast(res.message || '已移除');
                    await this.load();
                } catch { /* user cancelled */ }
            },
            fmt(ts) {
                if (!ts) return '—';
                try { return new Date(ts).toLocaleString('zh-CN'); } catch { return ts; }
            },
        },
        mounted() { this.load(); },
    };

    // -- BindingList ----------------------------------------------------------------
    const BindingList = {
        template: `
        <div>
            <h3 class="page-title">群绑定</h3>

            <!-- Add form -->
            <form @submit.prevent="doCreate" class="inline-form">
                <input type="number" v-model="form.qq_group_id" placeholder="QQ 群号" required style="width:180px">
                <select v-model="form.permission_group_id" required>
                    <option value="" disabled>选择权限组</option>
                    <option v-for="g in groupOptions" :key="g.id" :value="g.id">{{ g.display_name || g.name }}</option>
                </select>
                <button type="submit" :aria-busy="creating">绑定</button>
            </form>

            <div class="table-wrap">
                <table v-if="bindings.length">
                    <thead><tr><th>ID</th><th>QQ 群号</th><th>绑定权限组</th><th>创建时间</th><th>操作</th></tr></thead>
                    <tbody>
                        <tr v-for="b in bindings" :key="b.id">
                            <td>{{ b.id }}</td>
                            <td>{{ b.qq_group_id }}</td>
                            <td>{{ groupName(b.permission_group_id) }}</td>
                            <td>{{ fmt(b.created_at) }}</td>
                            <td><a href="#" @click.prevent="doDelete(b)" style="color:var(--pico-danger-background)">解除</a></td>
                        </tr>
                    </tbody>
                </table>
                <div v-else class="empty-state">暂无群绑定</div>
            </div>
        </div>`,
        data: () => ({
            bindings: [],
            groupOptions: [],
            groupMap: {},
            form: { qq_group_id: '', permission_group_id: '' },
            creating: false,
        }),
        methods: {
            async loadBindings() {
                try {
                    const res = await apiGet('/permissions/bindings');
                    this.bindings = res.data.items || [];
                } catch (e) {
                    showToast(e.message, 'error');
                }
            },
            async loadGroupOptions() {
                try {
                    const res = await apiGet('/permissions/groups?page=1&size=200');
                    this.groupOptions = res.data.items || [];
                    this.groupMap = {};
                    this.groupOptions.forEach(g => { this.groupMap[g.id] = g.display_name || g.name; });
                } catch (e) { /* non-critical */ }
            },
            groupName(pgId) {
                return this.groupMap[pgId] || `ID=${pgId}`;
            },
            async doCreate() {
                this.creating = true;
                try {
                    await apiPost('/permissions/bindings', {
                        qq_group_id: parseInt(this.form.qq_group_id),
                        permission_group_id: parseInt(this.form.permission_group_id),
                    });
                    showToast('绑定成功');
                    this.form = { qq_group_id: '', permission_group_id: '' };
                    await this.loadBindings();
                } catch (e) {
                    showToast(e.message, 'error');
                } finally {
                    this.creating = false;
                }
            },
            async doDelete(b) {
                try {
                    const name = this.groupName(b.permission_group_id);
                    await showConfirm('解除绑定', `确定解除 QQ 群 ${b.qq_group_id} 与 "${name}" 的绑定？`);
                    const res = await apiDelete(`/permissions/bindings/${b.id}`);
                    showToast(res.message || '已解除');
                    await this.loadBindings();
                } catch { /* user cancelled */ }
            },
            fmt(ts) {
                if (!ts) return '—';
                try { return new Date(ts).toLocaleString('zh-CN'); } catch { return ts; }
            },
        },
        mounted() {
            this.loadBindings();
            this.loadGroupOptions();
        },
    };

    // ---------------------------------------------------------------------------
    // App bootstrap
    // ---------------------------------------------------------------------------
    // Attach components to routes
    router.getRoutes().forEach(r => {
        const compMap = {
            login: LoginPage, home: Dashboard, groups: GroupList,
            'group-detail': GroupDetail, bindings: BindingList,
        };
        r.components = { default: compMap[r.name] };
    });

    const app = createApp({
        data: () => ({
            state,
            confirmState,
            toast,
        }),
        computed: {
            isLoginPage() {
                return this.$route.name === 'login';
            },
        },
        methods: {
            logout() {
                if (state.token) {
                    apiPost('/auth/logout', {}).catch(() => {});
                }
                clearToken();
                router.push('/login');
            },
        },
    });

    app.use(router);
    app.mount('#app');
    </script>
</body>
</html>
